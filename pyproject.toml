[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mahakrushi-ocr-benchmark"
version = "0.1.0"
description = "Reproducible multilingual OCR benchmark for MahaKrushi"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6", "Pillow>=10", "opencv-python-headless>=4.10", "pandas>=2.2", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dashboard = ["streamlit>=1.38", "plotly>=5.24"]
final = ["rapidfuzz>=3.14", "regex>=2024.11.6"]

[project.scripts]
ocr-bench = "mahakrushi_ocr_benchmark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
